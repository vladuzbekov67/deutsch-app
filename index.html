<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Немецкие слова · DDeutschD1</title>
<style>
  html,body{margin:0;height:100%;background:#faf8f4;
    -webkit-tap-highlight-color:transparent}
  .boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#9a96a6;text-align:center;padding:0 28px}
  .ring{width:26px;height:26px;border-radius:50%;
    border:2.5px solid #e9e7ef;border-top-color:#2c4a86;
    animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.ring{animation-duration:2s}}
</style>
</head>
<body>

<div class="boot" id="boot"><div class="ring"></div></div>

<script>
/* ==================================================================
   Загрузчик. Этот файл больше меняться не будет.
   Всё приложение лежит в app.html — он запрашивается со свежей меткой
   времени, поэтому Telegram и браузер не могут подсунуть старую копию.
   Обновление приложения = замена одного app.html, без правок в BotFather.
   ================================================================== */
(function(){
  "use strict";
  var box = document.getElementById('boot');

  function fail(msg){
    box.innerHTML = '<div>' + msg + '</div>' +
      '<div style="font-size:13px;opacity:.8">Проверьте интернет и откройте приложение заново.</div>';
  }

  var x = new XMLHttpRequest();
  /* Метка времени делает адрес уникальным — кэш к нему не применяется. */
  x.open('GET', 'app.html?t=' + new Date().getTime(), true);
  x.onload = function(){
    var h = x.responseText;
    if (x.status >= 200 && x.status < 300 && h && h.length > 1000){
      /* Переписываем документ целиком: адрес страницы и параметры Telegram
         в нём сохраняются, поэтому CloudStorage и тема оформления работают. */
      try{
        document.open();
        document.write(h);
        document.close();
      }catch(e){ fail('Не удалось открыть приложение.'); }
    } else {
      fail('Приложение временно недоступно.');
    }
  };
  x.onerror = function(){ fail('Нет связи с сервером.'); };
  x.ontimeout = function(){ fail('Сервер долго не отвечает.'); };
  x.timeout = 15000;
  try{ x.send(); }catch(e){ fail('Не удалось начать загрузку.'); }
})();
</script>

</body>
</html>
