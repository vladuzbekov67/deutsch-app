<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0b12">
<title>Немецкие слова · DDeutschD1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0b12; --bg2:#12142099;
  --card:rgba(255,255,255,.05); --brd:rgba(255,255,255,.09);
  --txt:#edeef5; --dim:#8b90a8;
  --gold:#f4c95d; --violet:#8b6cff;
  --green:#35d6a4; --red:#ff6b6b;
  --der:#6ea8ff; --die:#ff7aa8; --das:#4ddba0;
  --safe:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:16px; line-height:1.45; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(680px 420px at 12% -8%, rgba(139,108,255,.22), transparent 62%),
    radial-gradient(560px 380px at 92% 4%, rgba(244,201,93,.14), transparent 60%),
    radial-gradient(700px 500px at 50% 108%, rgba(53,214,164,.10), transparent 60%);
}
#app{max-width:520px;margin:0 auto;padding:14px 16px calc(96px + var(--safe));}
#app.nopad{padding-bottom:calc(18px + var(--safe))}
.hide{display:none!important}

/* ---------- типографика ---------- */
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.hello{font-size:13px;color:var(--dim);margin-bottom:2px}
.h-top h1{font-size:22px}
.dim{color:var(--dim)}
.tiny{font-size:12px;color:var(--dim)}

/* ---------- карточки ---------- */
.card{
  background:var(--card); border:1px solid var(--brd); border-radius:20px;
  padding:16px; margin-bottom:12px; position:relative; overflow:hidden;
  animation:up .38s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card.d1{animation-delay:.04s}.card.d2{animation-delay:.08s}.card.d3{animation-delay:.12s}.card.d4{animation-delay:.16s}

/* ---------- серия ---------- */
.streak{
  display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:100px;
  background:linear-gradient(135deg,rgba(244,201,93,.20),rgba(255,107,107,.14));
  border:1px solid rgba(244,201,93,.34);white-space:nowrap;
}
.streak b{font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
.streak .fl{font-size:18px;filter:drop-shadow(0 0 8px rgba(244,201,93,.75));animation:fl 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}

/* ---------- слово дня ---------- */
.wotd{
  background:linear-gradient(158deg,rgba(139,108,255,.24),rgba(255,255,255,.04) 58%);
  border-color:rgba(139,108,255,.35);
}
.wotd .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.wotd .de{font-size:33px;font-weight:700;letter-spacing:-.03em;margin:9px 0 3px;line-height:1.12}
.wotd .ru{font-size:16px;color:var(--dim)}
.wotd .ex{margin-top:12px;padding-top:12px;border-top:1px solid var(--brd);font-size:14px;font-style:italic;color:#c9cce0}
.art-der{color:var(--der)}.art-die{color:var(--die)}.art-das{color:var(--das)}

/* ---------- кнопки ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;border:0;border-radius:16px;font:inherit;font-weight:600;font-size:16px;
  color:#151626;background:linear-gradient(135deg,#f7d271,#f0b93f);cursor:pointer;
  transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:scale(.975);filter:brightness(.95)}
.btn.ghost{background:var(--card);border:1px solid var(--brd);color:var(--txt)}
.btn.sm{padding:11px 14px;font-size:14px;border-radius:13px;width:auto}

/* ---------- уровни ---------- */
.lvl{display:flex;align-items:center;gap:14px;cursor:pointer}
.lvl .meta{flex:1;min-width:0}
.lvl .nm{font-size:17px;font-weight:700}
.lvl .sb{font-size:13px;color:var(--dim)}
.lvl .chev{color:var(--dim);font-size:20px}
.lvl.locked{opacity:.45}
.ring{width:52px;height:52px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.ring .bgc{stroke:rgba(255,255,255,.10)}
.ring .fgc{stroke:var(--gold);transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.3,1)}
.ringwrap{position:relative;width:52px;height:52px;flex:none}
.ringwrap span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- наборы слов ---------- */
.pack{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:16px;background:var(--card);border:1px solid var(--brd);margin-bottom:9px;cursor:pointer;transition:transform .12s}
.pack:active{transform:scale(.985)}
.pack .ic{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.06);font-size:20px}
.pack .tt{flex:1;min-width:0}
.pack .tt b{display:block;font-size:15px;font-weight:600}
.stars{display:flex;gap:3px;font-size:13px;letter-spacing:1px;color:var(--gold)}
.st-off{color:#fff;opacity:.18}

/* ---------- квиз ---------- */
/* экран квиза: вопрос вверху, кнопки внизу — под большой палец */
#v-quiz{display:flex;flex-direction:column;min-height:calc(100vh - 130px - var(--safe))}
.qbar{height:5px;border-radius:100px;background:rgba(255,255,255,.09);overflow:hidden;margin-bottom:6px;flex:none}
.qbar i{display:block;height:100%;border-radius:100px;background:linear-gradient(90deg,var(--violet),var(--gold));transition:width .35s ease}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;color:var(--dim);flex:none}
.qhead #q-num{flex:1;text-align:center;font-variant-numeric:tabular-nums}
.qx{width:30px;height:30px;flex:none;border-radius:9px;border:1px solid var(--brd);background:var(--card);
  color:var(--dim);font:inherit;font-size:13px;line-height:1;cursor:pointer;padding:0}
.combo{color:var(--gold);font-weight:700;min-width:30px;text-align:right}
.qask{text-align:center;padding:26px 16px;margin:auto 0;flex:none}
#q-opts{flex:none}
#q-hint{flex:none}
.qask .tag{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700}
.qask .big{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:10px;line-height:1.14;word-break:break-word}
.qask .mid{font-size:22px;font-weight:600;margin-top:10px;line-height:1.3}
.qask .sub{font-size:13px;color:var(--dim);margin-top:8px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  width:100%;text-align:left;padding:15px 17px;border-radius:15px;
  background:var(--card);border:1px solid var(--brd);color:var(--txt);
  font:inherit;font-size:16px;cursor:pointer;transition:transform .1s,background .18s,border-color .18s;
}
.opt:active{transform:scale(.985)}
.opt.ok{background:rgba(53,214,164,.17);border-color:var(--green);color:#b6f6de}
.opt.no{background:rgba(255,107,107,.15);border-color:var(--red);color:#ffc7c7;animation:shake .34s}
.opt.pale{opacity:.4}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-7px)}55%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.opts3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.opts3 .opt{text-align:center;font-size:19px;font-weight:700;padding:19px 6px}
.hint{margin-bottom:12px;padding:13px 15px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--brd);font-size:14px;line-height:1.5;animation:up .3s both}
.hint b{color:var(--gold)}

/* ---------- результат ---------- */
.res{text-align:center;padding:30px 18px}
.res .bigstars{font-size:44px;letter-spacing:6px;margin:6px 0 14px;line-height:1}
.res .bigstars i{display:inline-block;font-style:normal;color:var(--gold);
  filter:drop-shadow(0 0 14px rgba(244,201,93,.6));
  animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.res .bigstars i.off{color:#fff;opacity:.16;filter:none}
.res .bigstars i:nth-child(2){animation-delay:.13s}.res .bigstars i:nth-child(3){animation-delay:.26s}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.res h2{font-size:24px;margin-bottom:6px}
.score{font-size:15px;color:var(--dim)}
.gain{margin-top:12px;display:inline-block;padding:7px 15px;border-radius:100px;font-size:14px;font-weight:700;
  color:#b6f6de;background:rgba(53,214,164,.16);border:1px solid rgba(53,214,164,.34)}
.tip{margin-top:14px;font-size:13px;line-height:1.5;color:var(--dim);text-align:left;
  padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--brd)}
.newach{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:16px;margin-top:12px;text-align:left;
  background:linear-gradient(135deg,rgba(244,201,93,.20),rgba(139,108,255,.14));border:1px solid rgba(244,201,93,.35);animation:up .4s both}
.newach .e{font-size:27px}
.newach b{display:block;font-size:15px}

/* ---------- награды ---------- */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach{padding:15px 13px;border-radius:17px;background:var(--card);border:1px solid var(--brd);text-align:center}
.ach .e{font-size:30px;line-height:1;margin-bottom:9px;display:block}
.ach b{font-size:14px;display:block;margin-bottom:3px}
.ach p{margin:0;font-size:11.5px;color:var(--dim);line-height:1.35}
.ach.lock{opacity:.36}
.ach.lock .e{filter:grayscale(1)}
.ach.on{border-color:rgba(244,201,93,.42);background:linear-gradient(150deg,rgba(244,201,93,.14),var(--card))}

/* ---------- магазин ---------- */
.shop{background:linear-gradient(150deg,rgba(53,214,164,.16),rgba(255,255,255,.04));border-color:rgba(53,214,164,.32)}
.shop .t{font-size:16px;font-weight:700;margin-bottom:5px}
.shop p{margin:0 0 13px;font-size:14px;color:#c3c8dc;line-height:1.5}

/* ---------- статистика ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center}
.stats div b{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.stats div span{font-size:11.5px;color:var(--dim)}

/* ---------- нижние вкладки ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:center;gap:6px;
  padding:8px 12px calc(8px + var(--safe));
  background:linear-gradient(to top,var(--bg) 62%,transparent);
  backdrop-filter:blur(12px);
}
.tab{
  flex:1;max-width:170px;padding:9px 8px;border-radius:14px;border:1px solid transparent;
  background:transparent;color:var(--dim);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.tab i{font-style:normal;font-size:18px;line-height:1}
.tab.on{color:var(--txt);background:var(--card);border-color:var(--brd)}
/* ---------- конфетти ---------- */
#conf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.15}}
</style>
</head>

</div>

var TG = null;
try { TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null; } catch(e){}
function tgv(v){ try{ return TG && TG.isVersionAtLeast && TG.isVersionAtLeast(v); }catch(e){ return false; } }
function haptic(kind){
  try{
    if(!TG || !TG.HapticFeedback) return;
    if(kind==='ok') TG.HapticFeedback.notificationOccurred('success');
    else if(kind==='no') TG.HapticFeedback.notificationOccurred('error');
    else if(kind==='win') TG.HapticFeedback.notificationOccurred('warning');
    else TG.HapticFeedback.impactOccurred(kind||'light');
  }catch(e){}
}
function openTg(url){
  try{ if(TG && TG.openTelegramLink) { TG.openTelegramLink(url); return; } }catch(e){}
  try{ window.open(url,'_blank'); }catch(e){}
}

/* ==================================================================
   3. ХРАНИЛИЩЕ
   Порядок: Telegram CloudStorage -> localStorage -> память.
   Никаких данных о пользователе мы не собираем и никуда не отправляем:
   прогресс лежит у самого пользователя внутри Telegram.
   ================================================================== */
var KEY = 'dw1';
var MEM = {};
var CS = null;
try { if(TG && TG.CloudStorage && tgv('6.9')) CS = TG.CloudStorage; } catch(e){}

function lsGet(k){ try{ var v=localStorage.getItem(k); return v==null?null:v; }catch(e){ return MEM[k]||null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ MEM[k]=v; } }

function load(cb){
  if(!CS){ cb(lsGet(KEY)); return; }
  var done=false;
  var t=setTimeout(function(){ if(!done){done=true; cb(lsGet(KEY));} },2500);
  try{
    CS.getItem(KEY,function(err,val){
      if(done) return; done=true; clearTimeout(t);
      if(err || val==null || val==='') cb(lsGet(KEY)); else cb(val);
    });
  }catch(e){ if(!done){done=true; clearTimeout(t); cb(lsGet(KEY));} }
}
var saveT=null;
function save(){
  var raw;
  try{ raw = JSON.stringify(S); }catch(e){ return; }
  lsSet(KEY, raw);
  if(!CS) return;
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    try{ CS.setItem(KEY, raw, function(){}); }catch(e){}
  },400);
}

function blank(){
  return {v:1, s:{n:0,d:''}, m:new Array(TOTAL+1).join('0'), p:{}, a:[],
          t:{q:0,c:0,best:0,ars:0}};
}
var S = blank();

function normalize(o){
  var b = blank();
  if(!o || typeof o!=='object') return b;
  if(o.s && typeof o.s.n==='number'){ b.s.n=o.s.n; b.s.d=String(o.s.d||''); }
  if(typeof o.m==='string'){
    var m=o.m.slice(0,TOTAL);
    while(m.length<TOTAL) m+='0';
    b.m=m;
  }
  if(o.p && typeof o.p==='object'){
    for(var k in o.p){ if(typeof o.p[k]==='number') b.p[k]=Math.max(0,Math.min(3,o.p[k]|0)); }
  }
  if(Object.prototype.toString.call(o.a)==='[object Array]') b.a=o.a.filter(function(x){return typeof x==='string';});
  if(o.t && typeof o.t==='object'){
    b.t.q=o.t.q|0; b.t.c=o.t.c|0; b.t.best=o.t.best|0; b.t.ars=o.t.ars|0;
  }
  return b;
}

function mGet(i){ return S.m.charCodeAt(i)-48; }
function mSet(i,v){
  v=Math.max(0,Math.min(3,v));
  S.m = S.m.substring(0,i) + String(v) + S.m.substring(i+1);
}
function learnedCount(){ var n=0; for(var i=0;i<TOTAL;i++) if(mGet(i)>=2) n++; return n; }
function packStars(id){ return S.p[id]||0; }
function levelDone(li){
  var pk=LEVELS[li].packs, i;
  for(i=0;i<pk.length;i++) if(packStars(pk[i].id)<1) return false;
  return true;
}
function levelPct(li){
  var pk=LEVELS[li].packs, sum=0, i;
  for(i=0;i<pk.length;i++) sum+=packStars(pk[i].id);
  return Math.round(sum/(pk.length*3)*100);
}
function levelOpen(li){ return li===0 ? true : levelDone(li-1); }

/* ---------- даты ---------- */
function ymd(d){
  var m=d.getMonth()+1, day=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
}
function todayStr(){ return ymd(new Date()); }
function yestStr(){ var d=new Date(); d.setDate(d.getDate()-1); return ymd(d); }
function touchStreak(){
  var t=todayStr();
  if(S.s.d===t) return;
  S.s.n = (S.s.d===yestStr()) ? S.s.n+1 : 1;
  S.s.d = t;
  save();
}

function has(id){ return S.a.indexOf(id)>=0; }
function grant(id,box){ if(!has(id)){ S.a.push(id); if(box) box.push(id); } }
function checkAch(ctx){
  ctx = ctx || {};
  var got=[], L=learnedCount(), i, all3=true;
  if(Object.keys(S.p).length>0) grant('start',got);
  if(ctx.perfect) grant('perfect',got);
  if(S.s.n>=3) grant('streak3',got);
  if(S.s.n>=7) grant('streak7',got);
  if(S.s.n>=30) grant('streak30',got);
  if(L>=25) grant('w25',got);
  if(L>=50) grant('w50',got);
  if(L>=100) grant('w100',got);
  if(L>=TOTAL) grant('w150',got);
  if(levelDone(0)) grant('lvl_a1',got);
  if(levelDone(1)) grant('lvl_a2',got);
  if(levelDone(2)) grant('lvl_b1',got);
  if(S.t.ars>=15) grant('artikel',got);
  if(ctx.seconds!=null && ctx.seconds<60 && ctx.answered>=10) grant('fast',got);
  if(new Date().getHours()>=23) grant('owl',got);
  for(i=0;i<FLAT.length;i+=10){ if(packStars(FLAT[i].pkId)<3){ all3=false; break; } }
  if(all3) grant('gold',got);
  if(got.length) save();
  return got;
}
function achById(id){ for(var i=0;i<ACH.length;i++) if(ACH[i].id===id) return ACH[i]; return null; }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){ var i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i];a[i]=a[j];a[j]=t; } return a; }
function plural(n,one,few,many){
  var m10=n%10, m100=n%100;
  if(m10===1 && m100!==11) return one;
  if(m10>=2 && m10<=4 && (m100<12||m100>14)) return few;
  return many;
}
function artHtml(w){ return w.art ? '<span class="art-'+w.art+'">'+w.art+'</span> ' : ''; }
function starRow(n){
  var s='',i;
  for(i=0;i<3;i++) s += i<n ? '<span>★</span>' : '<span class="st-off">★</span>';
  return '<div class="stars">'+s+'</div>';
}

var VIEWS=['home','level','quiz','res','ach'];
var view='home', lastLevel=0;
function go(v,arg){
  view=v;
  VIEWS.forEach(function(x){ document.getElementById('v-'+x).classList.add('hide'); });
  document.getElementById('v-'+v).classList.remove('hide');
  document.getElementById('tab-home').classList.toggle('on', v!=='ach');
  document.getElementById('tab-ach').classList.toggle('on', v==='ach');
  /* во время раунда прячем вкладки, чтобы случайный тап не оборвал его */
  document.getElementById('tabs').classList.toggle('hide', v==='quiz');
  document.getElementById('app').classList.toggle('nopad', v==='quiz');
  window.scrollTo(0,0);
  try{
    if(TG && TG.BackButton){
      if(v==='home') TG.BackButton.hide(); else TG.BackButton.show();
    }
  }catch(e){}
  if(v==='home') renderHome();
  if(v==='level') renderLevel(arg==null?lastLevel:arg);
  if(v==='ach') renderAch();
}
function quitQuiz(){ haptic('light'); go('level', Q ? Q.li : lastLevel); }
function back(){
  if(view==='quiz'){ go('level', lastLevel); return; }
  if(view==='level'||view==='res'||view==='ach'){ go('home'); return; }
  go('home');
}

    '<button class="btn ghost sm" style="margin-top:14px" onclick="shareWord()">↗ Поделиться</button>';

  document.getElementById('s-learn').textContent = learnedCount();
  document.getElementById('s-acc').textContent = (S.t.q ? Math.round(S.t.c/S.t.q*100) : 0)+'%';
  document.getElementById('s-ach').textContent = S.a.length;

  var h='';
  LEVELS.forEach(function(lv,li){
    var open=levelOpen(li), pct=levelPct(li), off=119.4*(1-pct/100);
    h += '<div class="card lvl d'+(li+1)+(open?'':' locked')+'" '+(open?'onclick="go(\'level\','+li+')"':'')+'>'+
      '<div class="ringwrap"><svg class="ring" viewBox="0 0 44 44">'+
        '<circle class="bgc" cx="22" cy="22" r="19"></circle>'+
        '<circle class="fgc" cx="22" cy="22" r="19" stroke-dasharray="119.4" stroke-dashoffset="'+off+'"></circle>'+
      '</svg><span>'+(open?pct+'%':'🔒')+'</span></div>'+
      '<div class="meta"><div class="nm">'+lv.title+' · '+esc(lv.subtitle)+'</div>'+
      '<div class="sb">'+(open?('50 слов · 5 наборов'):('откроется после '+LEVELS[li-1].title))+'</div></div>'+
      '<div class="chev">'+(open?'›':'')+'</div></div>';
  });
  document.getElementById('levels').innerHTML=h;

  document.getElementById('shop-slot').innerHTML = levelDone(1) ? shopCard() : '';
}
function shareWord(){
  haptic('light');
  var w=FLAT[wotdIndex()];
  var text = (w.art?w.art+' ':'')+w.de+' — '+w.ru+'\n'+w.ex+'\n\nСлово дня из тренажёра канала DDeutschD1';
  openTg('https://t.me/share/url?url='+encodeURIComponent('https://t.me/DDeutschD1')+'&text='+encodeURIComponent(text));
}
function shopCard(){
  return '<div class="card shop d4">'+
    '<div class="t">Готовы к настоящим текстам?</div>'+
    '<p>Вы закрыли A2 — это уже уверенный бытовой немецкий. В боте есть готовые уроки с диалогами и заданиями по темам «Жильё», «Поездка», «Разговорные разминки».</p>'+
    '<button class="btn" onclick="openShop()">Посмотреть материалы</button></div>';
}
function openShop(){ haptic('light'); openTg('https://t.me/DDeutschD1_bot?start=catalog'); }

/* ==================================================================
   9. ЭКРАН УРОВНЯ
   ================================================================== */
function renderLevel(li){
  lastLevel=li;
  var lv=LEVELS[li], pct=levelPct(li);
  document.getElementById('lv-name').textContent = lv.title+' · '+lv.subtitle;
  document.getElementById('lv-sub').textContent = 'Уровень';
  document.getElementById('lv-ring').setAttribute('stroke-dashoffset', 119.4*(1-pct/100));
  document.getElementById('lv-pct').textContent = pct+'%';
  var h='';

    h += '<div class="pack" onclick="startQuiz('+li+','+pi+')">'+
      '<div class="ic">'+pk.icon+'</div>'+

      starRow(packStars(pk.id))+
      '<div class="chev dim">›</div></div>';
  });
  document.getElementById('packs').innerHTML=h;
}

/* ==================================================================
   10. КВИЗ
   ================================================================== */
var Q = null;

function buildQuestions(li,pi){
  var pk=LEVELS[li].packs[pi];
  var pool=[], i;
  for(i=0;i<10;i++) pool.push(FLAT[li*50+pi*10+i]);
  var order=shuffle(pool.slice());
  var kinds=['de2ru','ru2de','art','gap'];
  var qs=[];
  order.forEach(function(w,idx){
    var kind=kinds[idx%4];
    if(kind==='art' && !w.art) kind='de2ru';
    if(kind==='gap' && w.ex.indexOf(w.de)<0) kind='ru2de';
    qs.push(makeQ(kind,w,pool));
  });
  return qs;
}
function others(pool,w,field,n){
  var res=[], seen={}, cand=shuffle(pool.filter(function(x){return x.gi!==w.gi;})), i;
  seen[w[field]]=1;
  for(i=0;i<cand.length && res.length<n;i++){
    if(!seen[cand[i][field]]){ seen[cand[i][field]]=1; res.push(cand[i][field]); }
  }
  return res;
}
function makeQ(kind,w,pool){
  var q={kind:kind,w:w};
  if(kind==='de2ru'){
    q.tag='Как переводится?';
    q.big=artHtml(w)+esc(w.de);
    q.right=w.ru;
    q.opts=shuffle(others(pool,w,'ru',3).concat([w.ru]));
  } else if(kind==='ru2de'){
    q.tag='Как будет по-немецки?';
    q.big=esc(w.ru);
    q.right=w.de;
    q.opts=shuffle(others(pool,w,'de',3).concat([w.de]));
  } else if(kind==='art'){
    q.tag='Какой артикль?';
    q.big=esc(w.de);
    q.sub=esc(w.ru);
    q.right=w.art;
    q.opts=['der','die','das'];
    q.three=true;
  } else {
    q.tag='Вставьте слово';
    q.mid=esc(w.ex.split(w.de).join('______'));
    q.right=w.de;
    q.opts=shuffle(others(pool,w,'de',3).concat([w.de]));
  }
  return q;
}

function startQuiz(li,pi){
  haptic('light');
  lastLevel=li;
  /* lb — сколько слов было выучено ДО начала раунда. Считаем именно здесь:
     каждый верный ответ повышает прогресс слова сразу, поэтому замер в конце
     раунда уже включал бы новые слова и прибавка всегда получалась нулевой. */
  Q={li:li, pi:pi, pk:LEVELS[li].packs[pi], qs:buildQuestions(li,pi),
     i:0, correct:0, combo:0, best:0, t0:Date.now(), lock:false,
     lb:learnedCount()};
  go('quiz');
  renderQ();
}
function renderQ(){
  var q=Q.qs[Q.i];
  Q.lock=false;
  document.getElementById('q-bar').style.width = (Q.i/Q.qs.length*100)+'%';
  document.getElementById('q-num').textContent = (Q.i+1)+' / '+Q.qs.length;
  document.getElementById('q-combo').textContent = Q.combo>=3 ? ('серия ×'+Q.combo) : '';
  document.getElementById('q-hint').innerHTML='';
  var a='<div class="tag">'+q.tag+'</div>';
  if(q.big) a+='<div class="big">'+q.big+'</div>';
  if(q.mid) a+='<div class="mid">'+q.mid+'</div>';
  if(q.sub) a+='<div class="sub">'+q.sub+'</div>';
  document.getElementById('q-ask').innerHTML=a;
  var h='<div class="'+(q.three?'opts3':'opts')+'">',i;
  for(i=0;i<q.opts.length;i++)
    h += '<button class="opt" data-v="'+esc(q.opts[i])+'" onclick="answer(this)">'+esc(q.opts[i])+'</button>';
  document.getElementById('q-opts').innerHTML = h+'</div>';
}
function answer(btn){
  if(Q.lock) return;
  Q.lock=true;
  var q=Q.qs[Q.i], val=btn.getAttribute('data-v'), ok=(val===q.right);
  var all=document.querySelectorAll('#q-opts .opt'), i;
  for(i=0;i<all.length;i++){
    var v=all[i].getAttribute('data-v');
    if(v===q.right) all[i].classList.add('ok');
    else if(all[i]===btn) all[i].classList.add('no');
    else all[i].classList.add('pale');
  }
  S.t.q++;
  if(q.kind==='art'){ S.t.ars = ok ? S.t.ars+1 : 0; }
  if(ok){
    S.t.c++; Q.correct++; Q.combo++;
    if(Q.combo>Q.best) Q.best=Q.combo;
    if(Q.combo>S.t.best) S.t.best=Q.combo;
    mSet(q.w.gi, Math.min(3, mGet(q.w.gi)+1));
    haptic('ok');
  } else {
    Q.combo=0;
    /* Прогресс слова никогда не падает: терять уже заработанное демотивирует.
       Слово просто не продвигается и вернётся в следующем раунде. */
    haptic('no');
    document.getElementById('q-hint').innerHTML =
      '<div class="hint"><b>'+(q.w.art?q.w.art+' ':'')+esc(q.w.de)+'</b> — '+esc(q.w.ru)+
      '<br><span class="dim">'+esc(q.w.ex)+'</span></div>';
  }
  save();
  setTimeout(function(){
    Q.i++;
    if(Q.i>=Q.qs.length) finish(); else renderQ();
  }, ok?520:1550);
}
function finish(){
  var stars = Q.correct>=10?3 : Q.correct>=8?2 : Q.correct>=6?1 : 0;
  var prev = packStars(Q.pk.id);
  var wasLevelDone = levelDone(Q.li);
  var learnBefore = (typeof Q.lb==='number') ? Q.lb : learnedCount();
  var i;
  /* Безошибочный раунд — это доказательство, что весь набор освоен:
     даём каждому слову дополнительный +1, поэтому 10/10 сразу
     переводит все десять слов в статус «выучено». */
  if(Q.correct===Q.qs.length){
    for(i=0;i<10;i++){
      var gi=Q.li*50+Q.pi*10+i;
      mSet(gi, Math.min(3, mGet(gi)+1));
    }
  }
  if(stars>prev) S.p[Q.pk.id]=stars;
  else if(!(Q.pk.id in S.p)) S.p[Q.pk.id]=stars;
  var learnDelta = learnedCount()-learnBefore;
  var allKnown = true;
  for(i=0;i<10;i++) if(mGet(Q.li*50+Q.pi*10+i)<2){ allKnown=false; break; }
  var secs = Math.max(1, Math.round((Date.now()-Q.t0)/1000));
  var got = checkAch({perfect:Q.correct===Q.qs.length, seconds:secs, answered:Q.qs.length});
  save();

  var justFinishedLevel = !wasLevelDone && levelDone(Q.li);
  var titles = ['Ещё немного','Хорошо!','Отлично!','Идеально!'];
  var h='<div class="card res">'+
    '<div class="bigstars">'+
      '<i class="'+(stars<1?'off':'')+'">★</i>'+
      '<i class="'+(stars<2?'off':'')+'">★</i>'+
      '<i class="'+(stars<3?'off':'')+'">★</i>'+
    '</div>'+
    '<h2>'+titles[stars]+'</h2>'+
    '<div class="score">'+Q.correct+' из '+Q.qs.length+' · '+secs+' сек'+
      (Q.best>=4?(' · серия ×'+Q.best):'')+'</div>'+
    (learnDelta>0
      ? '<div class="gain">+'+learnDelta+' '+plural(learnDelta,'слово','слова','слов')+' выучено</div>'
      : allKnown
        ? '<div class="gain">Все 10 слов этого набора уже выучены</div>'
        : '<div class="tip">Слово засчитывается, когда вы ответите на него верно дважды. Пройдите набор ещё раз — и он закрепится.</div>')+
    '</div>';

  got.forEach(function(id){
    var a=achById(id); if(!a) return;
    h += '<div class="newach"><div class="e">'+a.e+'</div><div><b>Новая награда: '+a.t+'</b>'+
         '<span class="tiny">'+a.d+'</span></div></div>';
  });

  if(justFinishedLevel && Q.li===1) h += shopCard();

  h += '<div style="display:flex;gap:9px;margin-top:16px">'+
       '<button class="btn ghost" onclick="go(\'level\','+Q.li+')">К наборам</button>'+
       '<button class="btn" onclick="startQuiz('+Q.li+','+Q.pi+')">Ещё раз</button></div>';

  document.getElementById('v-res').innerHTML=h;
  go('res');
  if(stars===3 || got.length){ confetti(); haptic('win'); }
}

/* ==================================================================
   11. НАГРАДЫ — ЭКРАН
   ================================================================== */
function renderAch(){
  document.getElementById('ach-cnt').textContent = S.a.length+' из '+ACH.length+' получено';
  var h='';
  ACH.forEach(function(a){
    var on=has(a.id);
    h += '<div class="ach '+(on?'on':'lock')+'"><span class="e">'+a.e+'</span>'+
         '<b>'+a.t+'</b><p>'+a.d+'</p></div>';
  });
  document.getElementById('ach-grid').innerHTML=h;
}

/* ==================================================================
   12. КОНФЕТТИ
   ================================================================== */
function confetti(){
  var box=document.getElementById('conf');
  var cols=['#f4c95d','#8b6cff','#35d6a4','#ff7aa8','#6ea8ff'], i, d;
  for(i=0;i<34;i++){
    d=document.createElement('i');
    d.style.left=(Math.random()*100)+'%';
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.5+Math.random()*1.4)+'s';
    d.style.animationDelay=(Math.random()*.35)+'s';
    box.appendChild(d);
  }
  setTimeout(function(){ box.innerHTML=''; }, 3400);
}
