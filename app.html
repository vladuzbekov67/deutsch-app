<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<title>Немецкие слова · DDeutschD1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#faf8f4; --ink:#232028; --ink2:#4e4a5a; --dim:#9a96a6; --line:#e9e7ef;
  --blue:#2b4a8b; --blue-s:#eef1f8;
  --red:#d6453c; --red-s:#fdeceb; --marg:#e8938c;
  --green:#2e8b6b; --green-s:#e9f5f0;
  --gold:#d99a1f;
  --der:#d6453c; --die:#b0398a; --das:#2f7d5b;
  --grid:rgba(43,74,139,.10);
  --serif:Lora,Georgia,"Times New Roman",serif;
  --sh1:0 1px 1px rgba(35,32,40,.06),0 10px 22px rgba(35,32,40,.07);
  --sh2:0 1px 1px rgba(35,32,40,.06),0 8px 18px rgba(35,32,40,.06);
  --safe:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:16px; line-height:1.45; overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
/* лист в клетку — фирменный фон всего приложения */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
#app{max-width:520px;margin:0 auto;padding:14px 16px calc(96px + var(--safe))}
#app.nopad{padding-bottom:calc(18px + var(--safe))}
.hide{display:none!important}

/* ---------- иконки ---------- */
.i{display:inline-block;width:1em;height:1em;flex:none;line-height:0}
.i svg{width:100%;height:100%;display:block}

/* ---------- типографика ---------- */
h1,h2,h3{margin:0;font-weight:700}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 15px}
.hello{font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:4px}
.h-top h1{font-family:var(--serif);font-size:26px;letter-spacing:-.5px}
.dim{color:var(--dim)}
.tiny{font-size:12px;color:var(--dim)}
.ver{margin:26px 0 4px;text-align:center;font-size:11px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--dim);opacity:.72}
.sec{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--dim);margin:22px 0 13px 3px}

/* ---------- карточки ---------- */
.card{
  background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;
  position:relative;overflow:hidden;box-shadow:var(--sh1);
  animation:up .38s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card.d1{animation-delay:.04s}.card.d2{animation-delay:.08s}.card.d3{animation-delay:.12s}.card.d4{animation-delay:.16s}

/* ---------- серия ---------- */
.streak{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;
  background:#fff;box-shadow:0 6px 14px rgba(35,32,40,.08);white-space:nowrap}
.streak .i{font-size:16px;color:var(--red);animation:fl 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.streak b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- слово дня: лист в клетку с полями ---------- */
.wotd{padding:18px 19px 17px 46px}
.wotd::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(43,74,139,.09) 1px,transparent 1px),
  linear-gradient(90deg,rgba(43,74,139,.09) 1px,transparent 1px);
  background-size:24px 24px}
.wotd::after{content:"";position:absolute;left:31px;top:0;bottom:0;width:1.5px;background:var(--marg)}
.wotd>*{position:relative}
.lab{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);font-weight:700}
.wotd .de{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:-1.1px;
  line-height:1.08;margin-top:9px;overflow-wrap:break-word}
.wotd .de.m{font-size:26px;letter-spacing:-.8px}
.wotd .de.s{font-size:21px;letter-spacing:-.5px}
.wotd .ru{font-family:var(--serif);font-style:italic;font-size:17px;color:#7c7889;margin-top:4px}
.hr{height:1px;background:rgba(43,74,139,.16);margin:14px 0 12px}
.wotd .ex{font-size:15px;color:var(--ink2);line-height:1.4}
.art-der{color:var(--der)}.art-die{color:var(--die)}.art-das{color:var(--das)}

/* ---------- кнопки ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;border:0;border-radius:10px;font:inherit;font-weight:700;font-size:15px;
  color:#fff;background:var(--blue);cursor:pointer;box-shadow:0 9px 20px rgba(43,74,139,.28);
  transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.975);filter:brightness(.94)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--sh2)}
.share{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:8px 14px;
  border-radius:8px;background:var(--blue-s);border:0;color:var(--blue);
  font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.share .i{font-size:13px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  margin-bottom:12px;padding:16px 19px;border:0;border-radius:10px;background:var(--blue);color:#fff;
  font:inherit;font-size:15px;font-weight:700;letter-spacing:-.2px;text-align:left;cursor:pointer;
  box-shadow:0 9px 20px rgba(43,74,139,.28);transition:transform .12s;
  animation:up .38s cubic-bezier(.2,.8,.3,1) .04s both}
.cta:active{transform:scale(.985)}
.cta .i{font-size:18px}

/* ---------- статистика ---------- */
.stats{display:flex;align-items:center;padding:14px 6px}
.st{flex:1;text-align:center}
.st b{display:block;font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.st span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px}
.stx{width:1px;height:28px;background:rgba(43,74,139,.14)}

/* ---------- уровни ---------- */
.lvl{display:flex;align-items:center;gap:13px;padding:18px 15px;cursor:pointer;transition:transform .12s}
.lvl:active{transform:scale(.99)}
.lvl .meta{flex:1;min-width:0}
.lvl .nm{font-size:16.5px;font-weight:700;letter-spacing:-.3px}
.lvl .sb{font-size:12.5px;color:var(--dim);margin-top:2px}
.lvl.locked{cursor:default}
.lvl.locked .nm{color:#6b6779}
.chev{font-size:16px;color:#c8c4d2}
.ringwrap{position:relative;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ringwrap::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.ringwrap span{position:relative;z-index:1;font-size:11.5px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.ringwrap.big{width:54px;height:54px}
.ringwrap.big::before{inset:6px}
.ringwrap.big span{font-size:13.5px}
.mark{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#f1f0f5;color:#bdb9c8}
.mark .i{font-size:20px}

/* ---------- наборы слов ---------- */
.pack{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:10px;background:#fff;
  margin-bottom:10px;cursor:pointer;box-shadow:var(--sh2);transition:transform .12s;
  animation:up .34s cubic-bezier(.2,.8,.3,1) both}
.pack:active{transform:scale(.985)}
.pack .ic{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:9px;
  background:var(--blue-s);color:var(--blue)}
.i2{display:inline-block;line-height:0;width:22px;height:22px}
.i2 svg{width:100%;height:100%;display:block}
.pack .tt{flex:1;min-width:0}
.pack .tt b{display:block;font-size:15px;font-weight:700}
.stars{display:flex;gap:3.5px;color:var(--gold)}
.stars i{width:13px;height:13px;line-height:0;display:block}
.stars i svg{width:100%;height:100%;display:block}
.stars i.st-off{color:#ddd9e4}

/* ---------- квиз ---------- */
#v-quiz{display:flex;flex-direction:column;min-height:calc(100vh - 34px - var(--safe))}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;color:var(--dim);flex:none}
.qhead #q-num{flex:1;text-align:center;font-variant-numeric:tabular-nums}
.qx{width:30px;height:30px;flex:none;border-radius:8px;border:0;background:#fff;color:var(--dim);
  box-shadow:0 1px 1px rgba(35,32,40,.06),0 5px 12px rgba(35,32,40,.06);
  display:grid;place-items:center;cursor:pointer;padding:0}
.qx .i{font-size:13px}
.combo{color:var(--red);font-weight:700;min-width:30px;text-align:right}
/* лист в клетку и в вопросе — тот же фирменный приём */
.qask{flex:0 0 auto;min-height:40vh;display:flex;flex-direction:column;
  text-align:left;padding:26px 18px 22px 46px;margin:0 0 14px}
.qtext{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
/* линейка раунда прямо на листе: видно, что уже отвечено и где ошибся */
.qdots{flex:none;display:flex;gap:5px;margin-top:20px}
.qdots i{flex:1 1 0;height:8px;border-radius:4px;background:#e4e2ec;
  transition:background .28s ease,transform .28s cubic-bezier(.2,1.6,.4,1)}
.qdots i.ok{background:var(--green)}
.qdots i.no{background:var(--red)}
.qdots i.now{background:var(--blue);transform:scaleY(1.6)}
.qask::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(43,74,139,.09) 1px,transparent 1px),
  linear-gradient(90deg,rgba(43,74,139,.09) 1px,transparent 1px);
  background-size:24px 24px}
.qask::after{content:"";position:absolute;left:31px;top:0;bottom:0;width:1.5px;background:var(--marg)}
.qask>*{position:relative}
.qask .tag{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);font-weight:700}
.qask .big{font-family:var(--serif);font-size:36px;font-weight:700;letter-spacing:-1.2px;margin-top:11px;line-height:1.1;overflow-wrap:break-word}
.qask .big.m{font-size:25px;letter-spacing:-.7px}
.qask .big.s{font-size:20px;letter-spacing:-.4px}
.qask .mid{font-family:var(--serif);font-size:21px;font-weight:600;margin-top:10px;line-height:1.35}
.qask .sub{font-family:var(--serif);font-style:italic;font-size:15px;color:#7c7889;margin-top:6px}
#q-hint{flex:none}
#q-opts,#tq-opts{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-end}
.opts{display:flex;flex-direction:column;gap:10px;flex:1 1 auto;justify-content:flex-end}
.opt{width:100%;text-align:left;padding:14px 17px;border-radius:10px;background:#fff;
  flex:1 1 0;min-height:58px;max-height:84px;display:flex;align-items:center;
  border:1.5px solid transparent;color:var(--ink);font:inherit;font-size:16px;cursor:pointer;
  box-shadow:var(--sh2);transition:transform .1s,background .18s,border-color .18s,color .18s}
.opt:active{transform:scale(.985)}
.opt.ok{background:var(--green-s);border-color:var(--green);color:#1d6b50}
.opt.no{background:var(--red-s);border-color:var(--red);color:#a83229;animation:shake .34s}
.opt.pale{opacity:.42;box-shadow:none}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-7px)}55%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.opts3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.opts3 .opt{justify-content:center;text-align:center;font-family:var(--serif);font-size:19px;
  font-weight:700;padding:19px 6px;max-height:none}
/* разбор ошибки — красная пометка на полях */
.hint{position:relative;margin-bottom:12px;padding:13px 15px 13px 18px;border-radius:10px;background:#fff;
  font-size:14px;line-height:1.5;box-shadow:var(--sh2);animation:up .3s both}
.hint::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;background:var(--marg)}
.hint b{font-family:var(--serif);font-size:16.5px}
.hint .ex{display:block;margin-top:5px;font-family:var(--serif);font-style:italic;font-size:13.5px;color:#7c7889}
.hint .hl{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--red);font-weight:700;margin-bottom:6px}
/* разбор ошибки держится на экране, пока человек сам не нажмёт «Дальше»:
   лист с вопросом ужимается и освобождает место под правильный перевод */
.qask{transition:min-height .34s cubic-bezier(.2,.8,.3,1)}
#v-quiz.wrong .qask{min-height:23vh}
#v-quiz.wrong .qask .big{font-size:29px}
#v-quiz.wrong .qask .qdots{margin-top:14px}
.nxt{flex:none;margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 18px;border:0;border-radius:10px;font:inherit;font-weight:700;font-size:15px;
  color:#fff;background:var(--blue);cursor:pointer;box-shadow:0 9px 20px rgba(43,74,139,.28);
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .32s ease,transform .32s cubic-bezier(.2,.9,.3,1),filter .12s ease}
.nxt.rdy{opacity:1;transform:none;pointer-events:auto}
.nxt:active{filter:brightness(.94)}
.nxt .i{font-size:15px}

/* ---------- тест уровня ---------- */
#v-test,#v-tq,#v-tres{display:flex;flex-direction:column;min-height:calc(100vh - 32px - var(--safe))}
/* лист занимает верхнюю половину экрана, кнопки живут внизу — как в раунде */
.tcard{flex:0 0 auto;min-height:44vh;display:flex;flex-direction:column;justify-content:center;
  padding:30px 20px 28px 46px;margin-bottom:14px}
.tcard::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(43,74,139,.09) 1px,transparent 1px),
  linear-gradient(90deg,rgba(43,74,139,.09) 1px,transparent 1px);
  background-size:24px 24px}
.tcard::after{content:"";position:absolute;left:31px;top:0;bottom:0;width:1.5px;background:var(--marg)}
.tcard>*{position:relative}
.tcard h2{font-family:var(--serif);font-size:27px;letter-spacing:-.9px;line-height:1.14;margin:11px 0 15px}
.tcard p{margin:0 0 11px;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.tcard p.tw{color:var(--dim);font-size:13.5px;margin-bottom:0}
.tact,.tact2{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  justify-content:flex-end;gap:9px}
.tres{min-height:47vh;text-align:center;padding:30px 20px 28px}
.tres::after{display:none}
.lvbig{font-family:var(--serif);font-size:64px;font-weight:700;letter-spacing:-3px;line-height:1;
  color:var(--blue);margin:6px 0 2px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.lvsub{font-family:var(--serif);font-style:italic;font-size:18px;color:#7c7889}
.tres .score{margin:11px 0 16px}
.tres p{margin:0;text-align:left;font-size:14px;line-height:1.55;padding:13px 15px;
  border-radius:9px;background:var(--blue-s);color:var(--ink2)}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex:none;font-size:12px;color:var(--dim)}
.thead b{flex:1;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700}
.thead .n{font-variant-numeric:tabular-nums}
.qdots i.done{background:var(--blue)}
.opt.sel{background:var(--blue-s);border-color:var(--blue);color:var(--blue)}
/* «проверить уровень» на главной — как строчка на полях тетради */
.relvl{width:100%;margin-top:4px;padding:13px;border:1.5px dashed rgba(43,74,139,.3);border-radius:10px;
  background:transparent;color:var(--blue);font:inherit;font-size:13px;font-weight:700;cursor:pointer;
  transition:background .18s ease}
.relvl:active{background:var(--blue-s)}
.lvl.mine{box-shadow:inset 0 2.5px 0 var(--blue),var(--sh1)}
/* «содержание» теста и лестница уровней — вместо пустого места под листом:
   человек сразу видит объём теста, а после теста — что именно ему открылось */
.tplan{flex:0 0 auto;padding:6px 14px}
.tp{display:flex;align-items:center;gap:11px;padding:13px 4px;
  border-bottom:1px dashed rgba(43,74,139,.2);
  opacity:0;transform:translateY(9px);animation:tpin .46s cubic-bezier(.2,.9,.3,1) both}
.tp:last-child{border-bottom:0}
@keyframes tpin{to{opacity:1;transform:none}}
.tp i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-size:11.5px;font-weight:700;color:var(--blue);
  background:var(--blue-s);border:1.5px solid rgba(43,74,139,.2)}
.tp i .i{width:13px;height:13px}
.tp b{font-family:var(--serif);font-size:16.5px;letter-spacing:-.4px;color:var(--ink)}
.tp span{flex:1;font-size:13.5px;color:var(--ink2)}
.tp em{font-style:normal;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  text-align:right}
.tp.now{background:var(--blue-s);border-radius:9px;border-bottom-color:transparent;padding:13px 9px}
.tp.now i{background:var(--blue);border-color:var(--blue);color:#fff}
.tp.now em{color:var(--blue);font-weight:700}
.tp.off{opacity:.45}
.tnote{margin:9px 4px 3px;font-size:11.5px;line-height:1.5;color:var(--dim);
  opacity:0;animation:tpin .46s .34s cubic-bezier(.2,.9,.3,1) both}

/* ---------- результат ---------- */
#v-res{display:flex;flex-direction:column;min-height:calc(100vh - 110px - var(--safe))}
.res{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  text-align:center;padding:28px 18px 26px}
.res::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(43,74,139,.07) 1px,transparent 1px),
  linear-gradient(90deg,rgba(43,74,139,.07) 1px,transparent 1px);
  background-size:24px 24px}
.res>*{position:relative}
.res .bigstars{display:flex;justify-content:center;gap:9px;margin:2px 0 14px;line-height:0}
.res .bigstars i{display:block;width:38px;height:38px;color:var(--gold);
  animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.res .bigstars i svg{width:100%;height:100%;display:block}
.res .bigstars i.off{color:#e2dfe9}
.res .bigstars i:nth-child(2){animation-delay:.13s}.res .bigstars i:nth-child(3){animation-delay:.26s}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.res h2{font-family:var(--serif);font-size:24px;margin-bottom:6px}
.score{font-size:14.5px;color:var(--dim)}
.gain{margin-top:13px;display:inline-block;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:700;
  color:#1d6b50;background:var(--green-s)}
.tip{margin-top:14px;font-size:13px;line-height:1.5;color:var(--ink2);text-align:left;
  padding:12px 14px;border-radius:8px;background:var(--blue-s)}
.newach{display:flex;align-items:center;gap:12px;padding:14px 15px;text-align:left;
  box-shadow:inset 0 2.5px 0 var(--gold),var(--sh2);animation:up .4s both}
.newach .e{width:28px;height:28px;flex:none;line-height:0}
.newach .e .i2{width:28px;height:28px}
.newach b{display:block;font-size:15px}
.res-act{margin-top:auto;padding-top:16px;display:flex;gap:9px}

/* ---------- награды ---------- */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ach{padding:16px 13px;border-radius:10px;background:#fff;text-align:center;box-shadow:var(--sh2)}
.ach .e{display:block;margin:0 auto 9px;line-height:0}
.ach .e .i2{width:30px;height:30px;color:var(--blue)}
.ach b{font-size:14px;display:block;margin-bottom:3px}
.ach p{margin:0;font-size:11.5px;color:var(--dim);line-height:1.35}
.ach.lock{background:#f5f3ef;box-shadow:none}
.ach.lock .e .i2{color:#c6c2d0!important}
.ach.lock b{color:#8b8798}
.ach.on{box-shadow:inset 0 2.5px 0 var(--blue),var(--sh2)}

/* ---------- магазин ---------- */
.shop{box-shadow:inset 0 2.5px 0 var(--gold),var(--sh1)}
.shop .t{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:6px}
.shop p{margin:0 0 13px;font-size:14px;color:var(--ink2);line-height:1.5}

/* ---------- нижние вкладки ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:11px 0 calc(11px + var(--safe));background:#fff;
  box-shadow:0 -1px 0 var(--line),0 -10px 28px rgba(35,32,40,.05)}
.tab{flex:1;max-width:170px;padding:0;border:0;background:transparent;color:#bdb9c8;
  font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tab .i{font-size:21px}
.tab b{font-size:11px;font-weight:700}
.tab.on{color:var(--blue)}

/* ---------- конфетти ---------- */
#conf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.15}}

/* ---------- перелистывание страницы тетради ---------- */
#pgfx{position:fixed;inset:0;z-index:69;pointer-events:none;opacity:0;
  will-change:transform,opacity;
  background:linear-gradient(90deg,
    rgba(35,32,40,.40) 0px,rgba(35,32,40,.20) 34px,
    rgba(35,32,40,.07) 88px,rgba(35,32,40,0) 150px)}
#pgfx.on{animation:pgshade .46s linear both}
/* полоса тени идёт ровно за сгибом: положение повторяет косинус угла поворота */
@keyframes pgshade{
  0%{opacity:.9;transform:translateX(100%)}
  17%{opacity:1;transform:translateX(99%)}
  35%{opacity:1;transform:translateX(79%)}
  52%{opacity:1;transform:translateX(29%)}
  70%{opacity:.85;transform:translateX(0%)}
  100%{opacity:0;transform:translateX(-6%)}
}

.flipping{
  position:fixed!important;z-index:70;box-sizing:border-box;overflow:hidden;
  padding:14px 16px;margin:0;
  background-color:var(--paper);
  background-image:
    linear-gradient(rgba(43,74,139,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(43,74,139,.055) 1px,transparent 1px);
  background-size:24px 24px;
  transform-origin:0 50%;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  will-change:transform;
  box-shadow:8px 0 30px rgba(35,32,40,.20);
  animation:pgturn .46s cubic-bezier(.45,.05,.3,1) both;
}
/* переплёт слева + блик на изгибе листа */
.flipping::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:
    linear-gradient(90deg,rgba(35,32,40,.44) 0%,rgba(35,32,40,.12) 16%,rgba(35,32,40,0) 36%),
    linear-gradient(90deg,rgba(255,255,255,0) 52%,rgba(255,255,255,.55) 100%),
    linear-gradient(rgba(35,32,40,.14),rgba(35,32,40,.14));
  animation:pgface .46s cubic-bezier(.45,.05,.3,1) both}
@keyframes pgturn{
  0%{transform:perspective(1800px) rotateY(0deg)}
  100%{transform:perspective(1800px) rotateY(-99deg)}
}
@keyframes pgface{0%{opacity:0}100%{opacity:1}}
/* следующая страница проявляется из-под уходящей */
.pgin{animation:pgin .40s cubic-bezier(.2,.8,.3,1) both}
@keyframes pgin{0%{opacity:.50}65%{opacity:1}100%{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .flipping,.flipping::after,#pgfx.on,.pgin{animation:none!important}
}

/* ==================================================================
   3. ХРАНИЛИЩЕ
   Порядок: Telegram CloudStorage -> localStorage -> память.
   Никаких данных о пользователе мы не собираем и никуда не отправляем:
   прогресс лежит у самого пользователя внутри Telegram.
   ================================================================== */
var KEY = 'dw1';
var MEM = {};
var CS = null;
try { if(TG && TG.CloudStorage && tgv('6.9')) CS = TG.CloudStorage; } catch(e){}

function lsGet(k){ try{ var v=localStorage.getItem(k); return v==null?null:v; }catch(e){ return MEM[k]||null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ MEM[k]=v; } }

function load(cb){
  if(!CS){ cb(lsGet(KEY)); return; }
  var done=false;
  var t=setTimeout(function(){ if(!done){done=true; cb(lsGet(KEY));} },2500);
  try{
    CS.getItem(KEY,function(err,val){
      if(done) return; done=true; clearTimeout(t);
      if(err || val==null || val==='') cb(lsGet(KEY)); else cb(val);
    });
  }catch(e){ if(!done){done=true; clearTimeout(t); cb(lsGet(KEY));} }
}
var saveT=null;
function save(){
  var raw;
  try{ raw = JSON.stringify(S); }catch(e){ return; }
  lsSet(KEY, raw);
  if(!CS) return;
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    try{ CS.setItem(KEY, raw, function(){}); }catch(e){}
  },400);
}

function blank(){
  /* lv — уровень, который показал тест (0=A1, 1=A2, 2=B1)
     tst — 0 тест не пройден, 1 пройден, 2 пропущен («начинаю с нуля») */
  return {v:1, s:{n:0,d:''}, m:new Array(TOTAL+1).join('0'), p:{}, a:[],
          t:{q:0,c:0,best:0,ars:0}, lv:0, tst:0};
}
var S = blank();

function normalize(o){
  var b = blank();
  if(!o || typeof o!=='object') return b;
  if(o.s && typeof o.s.n==='number'){ b.s.n=o.s.n; b.s.d=String(o.s.d||''); }
  if(typeof o.m==='string'){
    var m=o.m.slice(0,TOTAL);
    while(m.length<TOTAL) m+='0';
    b.m=m;
  }
  if(o.p && typeof o.p==='object'){
    for(var k in o.p){ if(typeof o.p[k]==='number') b.p[k]=Math.max(0,Math.min(3,o.p[k]|0)); }
  }
  if(Object.prototype.toString.call(o.a)==='[object Array]') b.a=o.a.filter(function(x){return typeof x==='string';});
  if(o.t && typeof o.t==='object'){
    b.t.q=o.t.q|0; b.t.c=o.t.c|0; b.t.best=o.t.best|0; b.t.ars=o.t.ars|0;
  }
  if(typeof o.lv==='number')  b.lv  = Math.max(0, Math.min(LEVELS.length-1, o.lv|0));
  if(typeof o.tst==='number') b.tst = Math.max(0, Math.min(2, o.tst|0));
  return b;
}

function mGet(i){ return S.m.charCodeAt(i)-48; }
function mSet(i,v){
  v=Math.max(0,Math.min(3,v));
  S.m = S.m.substring(0,i) + String(v) + S.m.substring(i+1);
}
function learnedCount(){ var n=0; for(var i=0;i<TOTAL;i++) if(mGet(i)>=2) n++; return n; }
function packStars(id){ return S.p[id]||0; }
function levelDone(li){
  var pk=LEVELS[li].packs, i;
  for(i=0;i<pk.length;i++) if(packStars(pk[i].id)<1) return false;
  return true;
}
function levelPct(li){
  var pk=LEVELS[li].packs, sum=0, i;
  for(i=0;i<pk.length;i++) sum+=packStars(pk[i].id);
  return Math.round(sum/(pk.length*3)*100);
}
function startLevel(){ return Math.max(0, Math.min(LEVELS.length-1, S.lv|0)); }
/* Уровни вплоть до определённого тестом открыты сразу: заставлять человека,
   который уже знает A1, проходить его заново — верный способ его потерять. */
function levelOpen(li){ return li<=startLevel() || levelDone(li-1); }

/* ---------- даты ---------- */
function ymd(d){
  var m=d.getMonth()+1, day=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
}
function todayStr(){ return ymd(new Date()); }
function yestStr(){ var d=new Date(); d.setDate(d.getDate()-1); return ymd(d); }
function touchStreak(){
  var t=todayStr();
  if(S.s.d===t) return;
  S.s.n = (S.s.d===yestStr()) ? S.s.n+1 : 1;
  S.s.d = t;
  save();
}

function has(id){ return S.a.indexOf(id)>=0; }
function grant(id,box){ if(!has(id)){ S.a.push(id); if(box) box.push(id); } }
function checkAch(ctx){
  ctx = ctx || {};
  var got=[], L=learnedCount(), i, all3=true;
  if(Object.keys(S.p).length>0) grant('start',got);
  if(ctx.perfect) grant('perfect',got);
  if(S.s.n>=3) grant('streak3',got);
  if(S.s.n>=7) grant('streak7',got);
  if(S.s.n>=30) grant('streak30',got);
  if(L>=25) grant('w25',got);
  if(L>=50) grant('w50',got);
  if(L>=100) grant('w100',got);
  if(L>=TOTAL) grant('w150',got);
  if(levelDone(0)) grant('lvl_a1',got);
  if(levelDone(1)) grant('lvl_a2',got);
  if(levelDone(2)) grant('lvl_b1',got);
  if(S.t.ars>=15) grant('artikel',got);
  if(ctx.seconds!=null && ctx.seconds<60 && ctx.answered>=10) grant('fast',got);
  if(new Date().getHours()>=23) grant('owl',got);
  for(i=0;i<FLAT.length;i+=10){ if(packStars(FLAT[i].pkId)<3){ all3=false; break; } }
  if(all3) grant('gold',got);
  if(got.length) save();
  return got;
}
function achById(id){ for(var i=0;i<ACH.length;i++) if(ACH[i].id===id) return ACH[i]; return null; }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){ var i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i];a[i]=a[j];a[j]=t; } return a; }
function plural(n,one,few,many){
  var m10=n%10, m100=n%100;
  if(m10===1 && m100!==11) return one;
  if(m10>=2 && m10<=4 && (m100<12||m100>14)) return few;
  return many;
}
function artHtml(w){ return w.art ? '<span class="art-'+w.art+'">'+w.art+'</span> ' : ''; }
/* Вариант ответа на кнопке: артикль подсвечен своим цветом — тем же, что и во
   всём приложении. Род запоминается глазами, а не отдельным зубрёжным усилием.
   На сравнение это не влияет: сверяем data-v, а там обычный текст. */
function optHtml(v){
  var m=/^(der|die|das) (.+)$/.exec(v);
  /* Кнопка — flex-контейнер, обычный пробел между элементами схлопывается,
     поэтому пробел живёт неразрывным внутри самого артикля. */
  return m ? '<span class="art-'+m[1]+'">'+m[1]+'&nbsp;</span>'+esc(m[2]) : esc(v);
}
function starRow(n){
  var s='',i;
  for(i=0;i<3;i++) s += '<i class="'+(i<n?'':'st-off')+'">'+STAR+'</i>';
  return '<div class="stars">'+s+'</div>';
}

var view='home', lastLevel=0;
/* ---- перелистывание: уходящий экран поворачивается вокруг левого поля ---- */
var FLIP_MS=460, flipEl=null, flipTid=0;
/* тяжёлый эффект сам отключается на слабых телефонах и при «меньше движения» */
var FLIP_OK=(function(){
  try{
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
    if(navigator.deviceMemory && navigator.deviceMemory<1) return false;
    if(navigator.hardwareConcurrency && navigator.hardwareConcurrency<2) return false;
  }catch(e){}
  return true;
})();
function flipEnd(){
  if(flipTid){ clearTimeout(flipTid); flipTid=0; }
  var el=flipEl; if(!el) return;
  flipEl=null;
  el.classList.remove('flipping');
  el.style.left=''; el.style.width=''; el.style.top=''; el.style.height='';
  if(el.id!=='v-'+view) el.classList.add('hide');
  var fx=document.getElementById('pgfx'); if(fx) fx.className='';
}
function flipStart(el,r){
  var off=r.top-14, fx=document.getElementById('pgfx');
  el.classList.remove('hide');
  el.style.left=(r.left-16)+'px';
  el.style.width=(r.width+32)+'px';
  el.style.top=off+'px';
  el.style.height=(window.innerHeight-off)+'px';
  el.classList.add('flipping');
  flipEl=el;
  if(fx){ fx.className=''; void fx.offsetWidth; fx.className='on'; }
  flipTid=setTimeout(flipEnd, FLIP_MS+60);
}
function go(v,arg){
  var old=null, r=null, cur;
  if(FLIP_OK && view && view!==v){
    cur=document.getElementById('v-'+view);
    if(cur && !cur.classList.contains('hide')){
      r=cur.getBoundingClientRect();
      if(r.width>0 && r.height>0) old=cur;
    }
  }
  flipEnd();
  view=v;
  VIEWS.forEach(function(x){ document.getElementById('v-'+x).classList.add('hide'); });
  document.getElementById('v-'+v).classList.remove('hide');
  document.getElementById('tab-home').classList.toggle('on', v!=='ach');
  document.getElementById('tab-ach').classList.toggle('on', v==='ach');
  /* во время раунда прячем вкладки, чтобы случайный тап не оборвал его */
  var solo = (v==='quiz'||v==='test'||v==='tq'||v==='tres');
  document.getElementById('tabs').classList.toggle('hide', solo);
  document.getElementById('app').classList.toggle('nopad', solo);
  window.scrollTo(0,0);
  try{
    if(TG && TG.BackButton){
      if(v==='home'||v==='test'||v==='tq'||v==='tres') TG.BackButton.hide();
      else TG.BackButton.show();
    }
  }catch(e){}
  if(v==='home') renderHome();
  if(v==='level') renderLevel(arg==null?lastLevel:arg);
  if(v==='ach') renderAch();
  if(old){
    var nv=document.getElementById('v-'+v);
    nv.classList.remove('pgin'); void nv.offsetWidth; nv.classList.add('pgin');
    flipStart(old,r);
    haptic('soft');
  }
}
function quitQuiz(){ haptic('light'); go('level', Q ? Q.li : lastLevel); }
function back(){
  if(view==='test'||view==='tq'||view==='tres') return;
  if(view==='quiz'){ go('level', lastLevel); return; }
  if(view==='level'||view==='res'||view==='ach'){ go('home'); return; }
  go('home');
}

function wotdIndex(){
  var d=new Date(), days=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);
  /* слово дня берём из уровня, который определил тест — не из всех 150 подряд */
  return startLevel()*50 + (((days%50)+50)%50);
}
/* Куда вести пользователя одной кнопкой: первый незакрытый набор. */
function nextPack(){
  /* Идём от уровня, который показал тест, и только потом — к остальным.
     Слова должны быть по силам: слишком лёгкие скучны, слишком трудные отпугивают. */
  var st=startLevel(), order=[], k,i,j,lv;
  for(i=st;i<LEVELS.length;i++) order.push(i);
  for(i=0;i<st;i++) order.push(i);
  for(k=0;k<order.length;k++){
    i=order[k];
    if(!levelOpen(i)) continue;
    lv=LEVELS[i];
    for(j=0;j<lv.packs.length;j++) if(packStars(lv.packs[j].id)<3) return {li:i,pi:j,rep:false};
  }
  return {li:st,pi:Math.floor(Math.random()*LEVELS[st].packs.length),rep:true};
}

var Q = null;

function buildQuestions(li,pi){
  var pk=LEVELS[li].packs[pi];
  var pool=[], i;
  for(i=0;i<10;i++) pool.push(FLAT[li*50+pi*10+i]);
  var order=shuffle(pool.slice());
  var kinds=['de2ru','ru2de','art','gap'];
  var qs=[];
  order.forEach(function(w,idx){
    var kind=kinds[idx%4];
    if(kind==='art' && !w.art) kind='de2ru';
    if(kind==='gap' && w.ex.indexOf(w.de)<0) kind='ru2de';
    qs.push(makeQ(kind,w,pool));
  });
  return qs;
}
/* Десять слов набора, к которому принадлежит слово. Варианты ответа берём
   только отсюда: иначе рядом с «Bauch» встают «вокзал» и «радость» из других
   тем — вопрос выглядит собранным наугад. */
function packPool(w){ var a=w.li*50+w.pi*10; return FLAT.slice(a,a+10); }

/* Ключ для сравнения вариантов: без регистра, без «ё», без ведущего артикля
   и без возвратного «sich» — сравниваем сами слова. */
function skey(t){
  return String(t).toLowerCase().replace(/ё/g,'е').split(',')[0].trim()
         .replace(/^(?:sich|der|die|das)\s+/,'');
}
/* Похожие слова нельзя ставить в один вопрос: «час» и «часы» (Stunde и Uhr)
   оба выглядят правильными, и человек ошибается не потому, что не знает слова. */
function tooClose(a,b){
  a=skey(a); b=skey(b);
  if(a===b) return true;
  if(a.indexOf(b)===0 || b.indexOf(a)===0) return true;
  return a.length>=4 && b.length>=4 && a.slice(0,4)===b.slice(0,4);
}
/* Два слова нельзя ставить в один вопрос, если похожи ЛИБО их русские переводы,
   либо сами немецкие слова. Проверяем обе стороны сразу: в вопросе «Как будет
   по-немецки? часы» вариант «die Stunde» (час) выглядит таким же правильным,
   хотя на кнопках только немецкий. */
function confusable(a,b){ return tooClose(a.ru,b.ru) || tooClose(a.de,b.de); }
function others(pool,w,field,n){
  var cand=shuffle(pool.filter(function(x){return x.gi!==w.gi;})), pick=[], out=[], i, j, bad;
  for(i=0;i<cand.length && pick.length<n;i++){
    bad=confusable(cand[i],w);
    for(j=0;j<pick.length && !bad;j++) if(confusable(cand[i],pick[j])) bad=true;
    if(!bad) pick.push(cand[i]);
  }
  /* Если после отсева вариантов не хватило — добираем оставшимися:
     четыре кнопки важнее идеальной чистоты. */
  for(i=0;i<cand.length && pick.length<n;i++)
    if(pick.indexOf(cand[i])<0) pick.push(cand[i]);
  for(i=0;i<pick.length;i++)
    if(out.indexOf(pick[i][field])<0) out.push(pick[i][field]);
  return out;
}
function makeQ(kind,w,pool){
  var q={kind:kind,w:w};
  if(kind==='de2ru'){
    q.tag='Как переводится?';
    q.big=artHtml(w)+esc(w.de);
    q.right=w.ru;
    q.opts=shuffle(others(pool,w,'ru',3).concat([w.ru]));
  } else if(kind==='ru2de'){
    q.tag='Как будет по-немецки?';
    q.big=esc(w.ru);
    /* Существительное показываем только с артиклем: артикль — часть слова,
       и запоминаться должен вместе с ним, а не отдельным упражнением. */
    q.right=w.lbl;
    q.opts=shuffle(others(pool,w,'lbl',3).concat([w.lbl]));
  } else if(kind==='art'){
    q.tag='Какой артикль?';
    q.big=esc(w.de);
    q.sub=esc(w.ru);
    q.right=w.art;
    q.opts=['der','die','das'];
    q.three=true;
  } else {
    /* Раньше вопрос был без подсказки — и в пропуск «Das ______ ist alt.»
       грамматически вставали сразу Haus, Zimmer, Bett и Fenster: верных ответов
       получалось несколько. Теперь сверху стоит русское слово, и правильный
       вариант ровно один. Артикль при этом виден в самом предложении. */
    q.tag='Вставьте слово';
    q.big=esc(w.ru);
    q.mid=esc(w.ex.split(w.de).join('______'));
    q.right=w.de;
    q.opts=shuffle(others(pool,w,'de',3).concat([w.de]));
  }
  return q;
}

function startQuiz(li,pi){
  haptic('light');
  lastLevel=li;
  /* lb — сколько слов было выучено ДО начала раунда. Считаем именно здесь:
     каждый верный ответ повышает прогресс слова сразу, поэтому замер в конце
     раунда уже включал бы новые слова и прибавка всегда получалась нулевой. */
  Q={li:li, pi:pi, pk:LEVELS[li].packs[pi], qs:buildQuestions(li,pi),
     i:0, res:[], correct:0, combo:0, best:0, t0:Date.now(), lock:false,
     lb:learnedCount()};
  go('quiz');
  renderQ();
}
function renderQ(){
  var q=Q.qs[Q.i], i;
  Q.lock=false;
  document.getElementById('v-quiz').classList.remove('wrong');
  document.getElementById('q-num').textContent = (Q.i+1)+' / '+Q.qs.length;
  document.getElementById('q-combo').textContent = Q.combo>=3 ? ('серия ×'+Q.combo) : '';
  document.getElementById('q-hint').innerHTML='';
  var a='<div class="qtext"><div class="tag">'+q.tag+'</div>';
  if(q.big) a+='<div class="big'+fit(q.big)+'">'+q.big+'</div>';
  if(q.mid) a+='<div class="mid">'+q.mid+'</div>';
  if(q.sub) a+='<div class="sub">'+q.sub+'</div>';
  a+='</div><div class="qdots">';
  for(i=0;i<Q.qs.length;i++) a+='<i class="'+(Q.res[i]||(i===Q.i?'now':''))+'"></i>';
  document.getElementById('q-ask').innerHTML=a+'</div>';
  var h='<div class="'+(q.three?'opts3':'opts')+'">';
  for(i=0;i<q.opts.length;i++)
    h += '<button class="opt" data-v="'+esc(q.opts[i])+'" onclick="answer(this)">'+optHtml(q.opts[i])+'</button>';
  document.getElementById('q-opts').innerHTML = h+'</div>';
}
function answer(btn){
  if(Q.lock) return;
  Q.lock=true;
  var q=Q.qs[Q.i], val=btn.getAttribute('data-v'), ok=(val===q.right);
  Q.res[Q.i] = ok?'ok':'no';
  var dot=document.querySelectorAll('.qdots i')[Q.i];
  if(dot) dot.className = Q.res[Q.i];
  var all=document.querySelectorAll('#q-opts .opt'), i;
  for(i=0;i<all.length;i++){
    var v=all[i].getAttribute('data-v');
    if(v===q.right) all[i].classList.add('ok');
    else if(all[i]===btn) all[i].classList.add('no');
    else all[i].classList.add('pale');
  }
  S.t.q++;
  if(q.kind==='art'){ S.t.ars = ok ? S.t.ars+1 : 0; }
  if(ok){
    S.t.c++; Q.correct++; Q.combo++;
    if(Q.combo>Q.best) Q.best=Q.combo;
    if(Q.combo>S.t.best) S.t.best=Q.combo;
    mSet(q.w.gi, Math.min(3, mGet(q.w.gi)+1));
    haptic('ok');
  } else {
    Q.combo=0;
    /* Прогресс слова никогда не падает: терять уже заработанное демотивирует.
       Слово просто не продвигается и вернётся в следующем раунде. */
    haptic('no');
    document.getElementById('q-hint').innerHTML =
      '<div class="hint"><span class="hl">Запомните</span>'+
      '<b>'+artHtml(q.w)+esc(q.w.de)+'</b> — '+esc(q.w.ru)+
      '<span class="ex">'+esc(q.w.ex)+'</span></div>';
  }
  save();
  if(ok){ setTimeout(nextQ, 520); return; }
  /* Ошибка — самый ценный момент раунда: именно здесь слово и запоминается.
     Поэтому дальше не уносит по таймеру — разбор висит, пока не нажмут «Дальше».
     Кнопка оживает через 0,7 с, чтобы палец, ещё лежащий на варианте ответа,
     случайно не пролистнул разбор. */
  document.getElementById('v-quiz').classList.add('wrong');
  Q.ready=false;
  var nx=document.createElement('button');
  nx.type='button';
  nx.className='nxt';
  nx.innerHTML='<span>Дальше</span>'+ic('arr');
  nx.onclick=function(){ if(Q.ready){ haptic('light'); nextQ(); } };
  document.getElementById('q-opts').appendChild(nx);
  setTimeout(function(){ Q.ready=true; nx.classList.add('rdy'); }, 700);
}
function nextQ(){
  Q.i++;
  if(Q.i>=Q.qs.length) finish(); else renderQ();
}
function finish(){
  var stars = Q.correct>=10?3 : Q.correct>=8?2 : Q.correct>=6?1 : 0;
  var prev = packStars(Q.pk.id);
  var wasLevelDone = levelDone(Q.li);
  var learnBefore = (typeof Q.lb==='number') ? Q.lb : learnedCount();
  var i;
  /* Безошибочный раунд — это доказательство, что весь набор освоен:
     даём каждому слову дополнительный +1, поэтому 10/10 сразу
     переводит все десять слов в статус «выучено». */
  if(Q.correct===Q.qs.length){
    for(i=0;i<10;i++){
      var gi=Q.li*50+Q.pi*10+i;
      mSet(gi, Math.min(3, mGet(gi)+1));
    }
  }
  if(stars>prev) S.p[Q.pk.id]=stars;
  else if(!(Q.pk.id in S.p)) S.p[Q.pk.id]=stars;
  var learnDelta = learnedCount()-learnBefore;
  var allKnown = true;
  for(i=0;i<10;i++) if(mGet(Q.li*50+Q.pi*10+i)<2){ allKnown=false; break; }
  var secs = Math.max(1, Math.round((Date.now()-Q.t0)/1000));
  var got = checkAch({perfect:Q.correct===Q.qs.length, seconds:secs, answered:Q.qs.length});
  save();

  var justFinishedLevel = !wasLevelDone && levelDone(Q.li);
  var titles = ['Ещё немного','Хорошо!','Отлично!','Идеально!'];
  var h='<div class="card res">'+
    '<div class="bigstars">'+
      '<i class="'+(stars<1?'off':'')+'">'+STAR+'</i>'+
      '<i class="'+(stars<2?'off':'')+'">'+STAR+'</i>'+
      '<i class="'+(stars<3?'off':'')+'">'+STAR+'</i>'+
    '</div>'+
    '<h2>'+titles[stars]+'</h2>'+
    '<div class="score">'+Q.correct+' из '+Q.qs.length+' · '+secs+' сек'+
      (Q.best>=4?(' · серия ×'+Q.best):'')+'</div>'+
    (learnDelta>0
      ? '<div class="gain">+'+learnDelta+' '+plural(learnDelta,'слово','слова','слов')+' выучено</div>'
      : allKnown
        ? '<div class="gain">Все 10 слов этого набора уже выучены</div>'
        : '<div class="tip">Слово засчитывается, когда вы ответите на него верно дважды. Пройдите набор ещё раз — и он закрепится.</div>')+
    '</div>';

  got.forEach(function(id){
    var a=achById(id); if(!a) return;
    h += '<div class="card newach"><div class="e">'+ic2(a.e,a.c)+'</div><div><b>Новая награда: '+a.t+'</b>'+
         '<span class="tiny">'+a.d+'</span></div></div>';
  });

  if(justFinishedLevel && Q.li===1) h += shopCard();

  h += '<div class="res-act">'+
       '<button class="btn ghost" onclick="go(\'level\','+Q.li+')">К наборам</button>'+
       '<button class="btn" onclick="startQuiz('+Q.li+','+Q.pi+')">Ещё раз</button></div>';

  document.getElementById('v-res').innerHTML=h;
  go('res');
  if(stars===3 || got.length){ confetti(); haptic('win'); }
}

/* ==================================================================
   10Б. ТЕСТ УРОВНЯ
   Три блока по пять слов: A1 -> A2 -> B1. Блок пройден (3 верных из 5) —
   ведём дальше, не пройден — останавливаемся. Новичок отвечает всего
   на 5 вопросов и сразу идёт учиться, продвинутый доходит до B1.
   ================================================================== */
var T = null;
var TPART = ['Часть 1 · простые слова','Часть 2 · средний уровень','Часть 3 · сложные слова'];

/* Пять слов уровня — по одному из каждого набора, чтобы блок покрывал все темы. */
function testWords(li){
  var out=[], j;
  for(j=0;j<LEVELS[li].packs.length;j++) out.push(FLAT[li*50+j*10+Math.floor(Math.random()*10)]);
  return shuffle(out);
}
function testBlock(li){
  var ws=testWords(li), qs=[], k, kind;
  for(k=0;k<ws.length;k++){
    kind = (k===2 && ws[k].art) ? 'art' : (k%2 ? 'ru2de' : 'de2ru');
    qs.push(makeQ(kind, ws[k], packPool(ws[k])));
  }
  return qs;
}

function startTest(again){
  haptic('light');
  T={b:0, i:0, qs:[], res:[], sc:[0,0,0], lock:false, again:!!again};
  document.getElementById('v-test').innerHTML =
    '<div class="card tcard">'+
      '<div class="lab">Тест уровня</div>'+
      '<h2>Насколько хорошо вы знаете немецкий?</h2>'+
      '<p>Три коротких блока по пять слов — от простых к сложным. Тест закончится раньше, '+
      'если станет трудно: дальше вас не поведут.</p>'+
      '<p class="tw">По результату приложение откроет ваш уровень и дальше будет подбирать '+
      'слова именно под него.</p>'+
    '</div>'+
    '<div class="card tplan">'+ planRows() +
      '<div class="tnote">Ответы никуда не отправляются: результат хранится только в вашем Telegram.</div>'+
    '</div>'+
    '<div class="tact">'+
      '<button class="btn" onclick="testBegin()"><span>Начать тест</span>'+ic('arr')+'</button>'+
      '<button class="btn ghost" onclick="testSkip()">Я начинаю с нуля</button>'+
    '</div>';
  go('test');
}
/* Содержание теста: три строчки, как оглавление в тетради. */
function planRows(){
  var d=['простые слова','средний уровень','сложные слова'], h='', i;
  for(i=0;i<3;i++)
    h += '<div class="tp" style="animation-delay:'+(70+i*80)+'ms"><i>'+(i+1)+'</i>'+
         '<b>'+LEVELS[i].title+'</b><span>'+d[i]+'</span><em>5 слов</em></div>';
  return h;
}
/* Лестница уровней после теста: что открылось, что учим, что впереди. */
function ladderRows(li){
  var h='', i, lv, st, em;
  for(i=0;i<LEVELS.length;i++){
    lv=LEVELS[i];
    st = i<li ? 'done' : (i===li ? 'now' : 'off');
    em = i<li ? 'для повторения' : (i===li ? 'ваш уровень' : 'откроется дальше');
    h += '<div class="tp '+st+'" style="animation-delay:'+(220+i*90)+'ms">'+
         '<i>'+(st==='done'?ic('check'):(st==='off'?ic('lock'):(i+1)))+'</i>'+
         '<b>'+lv.title+'</b><span>'+esc(lv.subtitle)+'</span><em>'+em+'</em></div>';
  }
  return h;
}
function testSkip(){
  haptic('light');
  S.lv=0; S.tst=2; save();
  go('home');
}
/* Закрыли тест на полпути — не держим: считаем, что человек начинает с нуля. */
function testQuit(){
  haptic('light');
  if(S.tst===0){ S.lv=0; S.tst=2; save(); }
  go('home');
}
function testBegin(){ T.b=0; T.sc=[0,0,0]; testLoad(); }
function testLoad(){
  T.qs=testBlock(T.b); T.i=0; T.res=[]; T.lock=false;
  renderT();
  go('tq');
}
function renderT(){
  var q=T.qs[T.i], i;
  T.lock=false;
  document.getElementById('tq-part').textContent = TPART[T.b];
  document.getElementById('tq-num').textContent = (T.i+1)+' / '+T.qs.length;
  var a='<div class="qtext"><div class="tag">'+q.tag+'</div>';
  if(q.big) a+='<div class="big'+fit(q.big)+'">'+q.big+'</div>';
  if(q.mid) a+='<div class="mid">'+q.mid+'</div>';
  if(q.sub) a+='<div class="sub">'+q.sub+'</div>';
  a+='</div><div class="qdots">';
  for(i=0;i<T.qs.length;i++) a+='<i class="'+(T.res[i]||(i===T.i?'now':''))+'"></i>';
  document.getElementById('tq-ask').innerHTML=a+'</div>';
  var h='<div class="'+(q.three?'opts3':'opts')+'">';
  for(i=0;i<q.opts.length;i++)
    h += '<button class="opt" data-v="'+esc(q.opts[i])+'" onclick="tanswer(this)">'+optHtml(q.opts[i])+'</button>';
  document.getElementById('tq-opts').innerHTML = h+'</div>';
}
function tanswer(btn){
  if(T.lock) return;
  T.lock=true;
  var q=T.qs[T.i], ok=(btn.getAttribute('data-v')===q.right);
  /* В тесте намеренно не показываем «верно/неверно»: это замер, а не урок.
     Пять красных пометок подряд в первую минуту знакомства — прямой путь к удалению. */
  btn.classList.add('sel');
  T.res[T.i]='done';
  var dot=document.querySelectorAll('#v-tq .qdots i')[T.i];
  if(dot) dot.className='done';
  if(ok){
    T.sc[T.b]++;
    /* верный ответ засчитываем слову как первый шаг — тест не проходит впустую */
    if(mGet(q.w.gi)<1) mSet(q.w.gi,1);
  }
  haptic('light');
  setTimeout(function(){
    T.i++;
    if(T.i<T.qs.length){ renderT(); return; }
    if(T.sc[T.b]>=3 && T.b<2){ T.b++; testLoad(); return; }
    testFinish();
  }, 280);
}
function testLevel(){
  if(T.sc[0]<3) return 0;
  if(T.sc[1]<3) return 1;
  return 2;
}
function testFinish(){
  var li=testLevel();
  S.lv=li; S.tst=1;
  save();
  var lv=LEVELS[li], asked=(T.b+1)*5, tot=T.sc[0]+T.sc[1]+T.sc[2], txt;
  if(li===0)
    txt='Начнём с основы: люди, дом, еда, время и первые глаголы. Это фундамент, на котором держится всё остальное — с ним дальше пойдёт легко.';
  else if(li===1)
    txt='Базовые слова вы уже знаете, поэтому A1 открыт просто для повторения. Учить будем A2: город, работа, здоровье, чувства.';
  else
    txt = (T.sc[2]>=4)
      ? 'Вы уверенно держитесь на B1. A1 и A2 открыты для повторения, а учить будем сложное: общество, карьеру, оттенки мысли.'
      : 'A1 и A2 вам уже по силам — они открыты для повторения. Пора за B1: общество, карьера, оттенки мысли.';
  var n=nextPack(), pk=LEVELS[n.li].packs[n.pi];
  document.getElementById('v-tres').innerHTML =
    '<div class="card tcard tres">'+
      '<div class="lab">Ваш уровень</div>'+
      '<div class="lvbig">'+lv.title+'</div>'+
      '<div class="lvsub">'+esc(lv.subtitle)+'</div>'+
      '<div class="score">'+tot+' из '+asked+' верных ответов</div>'+
      '<p>'+txt+'</p>'+
    '</div>'+
    '<div class="card tplan">'+ ladderRows(li) +'</div>'+
    '<div class="tact2">'+
      '<button class="btn" onclick="startQuiz('+n.li+','+n.pi+')"><span>Начать · '+esc(pk.title)+'</span>'+ic('arr')+'</button>'+
      '<button class="btn ghost" onclick="go(\'home\')">Сначала осмотрюсь</button>'+
    '</div>';
  go('tres');
  confetti(); haptic('win');
}

/* ==================================================================
   11. НАГРАДЫ — ЭКРАН
   ================================================================== */
function renderAch(){
  document.getElementById('ach-cnt').textContent = S.a.length+' из '+ACH.length+' получено';
  var h='';
  ACH.forEach(function(a){
    var on=has(a.id);
    h += '<div class="ach '+(on?'on':'lock')+'"><span class="e">'+ic2(a.e,on?a.c:'')+'</span>'+
         '<b>'+a.t+'</b><p>'+a.d+'</p></div>';
  });
  document.getElementById('ach-grid').innerHTML=h;
}

/* ==================================================================
   12. КОНФЕТТИ
   ================================================================== */
function confetti(){
  var box=document.getElementById('conf');
  var cols=['#2b4a8b','#d6453c','#d99a1f','#2e8b6b','#b0398a'], i, d;
  for(i=0;i<34;i++){
    d=document.createElement('i');
    d.style.left=(Math.random()*100)+'%';
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.5+Math.random()*1.4)+'s';
    d.style.animationDelay=(Math.random()*.35)+'s';
    box.appendChild(d);
  }
  setTimeout(function(){ box.innerHTML=''; }, 3400);
}

/* ==================================================================
   13. СТАРТ
   ================================================================== */
(function init(){
  paintIcons();
  try{
    if(TG){
      TG.ready();
      TG.expand();
      if(tgv('6.9')){ TG.setHeaderColor('#faf8f4'); TG.setBackgroundColor('#faf8f4'); }
      if(tgv('7.7') && TG.disableVerticalSwipes) TG.disableVerticalSwipes();
      if(TG.BackButton) TG.BackButton.onClick(back);
    }
  }catch(e){}

  load(function(raw){
    var parsed=null;
    if(raw){ try{ parsed=JSON.parse(raw); }catch(e){ parsed=null; } }
    S = normalize(parsed);
    touchStreak();
    checkAch({});
    save();
    /* Первый запуск: сначала определяем уровень, чтобы слова сразу были по силам.
       view='' — чтобы стартовый экран не «перелистнулся» с ещё пустой главной. */
    if(S.tst===0){ view=''; startTest(false); }
    else go('home');
  });
})();
</script>
